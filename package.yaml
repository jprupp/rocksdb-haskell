name: rocksdb-haskell-jprupp
version: 2.8.0
synopsis: Haskell bindings for RocksDB
description: See README at <https://github.com/jprupp/rocksdb-haskell#readme>
maintainer: JP Rupp <jprupp@protonmail.ch>
github: jprupp/rocksdb-haskell
category: Database, FFI
license: BSD3
license-file: LICENSE
extra-source-files:
  - README.md
  - CHANGELOG.md
  - AUTHORS
  - cbits/rocksdb_haskell.h

ghc-options: -Wall

dependencies:
  - base >= 4.9 && < 5
  - bytestring
  - data-default
  - directory

library:
  source-dirs: src
  exposed-modules:
    Database.RocksDB
  extra-libraries: rocksdb
  # what the C API of RocksDB lacks: see cbits/rocksdb_haskell.h
  c-sources: cbits/rocksdb_haskell.c
  include-dirs: cbits
  cc-options: -Wall

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - rocksdb-haskell-jprupp
      - hspec
      - QuickCheck
      - temporary
      - async
      - containers
      - directory
      - filepath

benchmarks:
  scan:
    main: Scan.hs
    source-dirs: bench
    # four capabilities whatever the machine has, so that sixteen threads
    # compete for them as the threads of a busy server do
    ghc-options:
      - -O2
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N4
    dependencies:
      - rocksdb-haskell-jprupp
      - async
      - temporary
