name: CI

# Every change is built and tested twice with Stack:
#
# - os-libraries: against the C libraries that Ubuntu packages, as most users
#   build it, with --no-nix;
# - nix: with --nix, so that GHC and the C libraries listed under "nix:" in
#   stack.yaml come from nixpkgs, as on NixOS or with "stack --nix" locally.
#
# Both jobs also build the Haddock documentation, so broken markup fails CI.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  os-libraries:
    name: Stack with OS libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Only this repository is checked out, so extra-deps that point at
      # sibling checkouts (such as ../haskoin-core) cannot build here.
      - name: Reject local path dependencies
        run: scripts/reject-local-path-deps.sh

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y librocksdb-dev

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          key: stack-os-${{ runner.os }}-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '**/package.yaml') }}
          restore-keys: stack-os-${{ runner.os }}-

      - name: Build, test and build the documentation
        run: stack --no-nix build --install-ghc --test --haddock --no-haddock-deps

  nix:
    name: Stack with Nix
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Only this repository is checked out, so extra-deps that point at
      # sibling checkouts (such as ../haskoin-core) cannot build here.
      - name: Reject local path dependencies
        run: scripts/reject-local-path-deps.sh

      # Stack runs the build inside nix-shell, which takes GHC and the
      # libraries from <nixpkgs>; nix_path points that at nixos-unstable.
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # What Stack builds under --nix is linked against /nix/store paths of
      # the nixpkgs revision that the channel pointed at on that day, glibc's
      # dynamic loader included. The store is not cached, so once the channel
      # moves, a restored ~/.stack holds executables (Stack's setup-exe-cache
      # first of all) whose loader no longer exists, and running them fails
      # with "posix_spawnp: does not exist". The revision is therefore part of
      # the cache key, and a cache from another revision is never restored.
      - name: Resolve the nixpkgs revision
        id: nixpkgs
        run: |
          version=$(nix-instantiate --eval --json -E '(import <nixpkgs> {}).lib.version' | jq -r .)
          echo "nixpkgs $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Stack
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-version: latest
          stack-no-global: true

      - name: Cache Stack
        uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            .stack-work
          # One key on two lines: in a double-quoted YAML scalar, a backslash
          # at the end of a line joins it to the next with nothing in between.
          key: "stack-nix-${{ runner.os }}-${{ steps.nixpkgs.outputs.version }}-\
            ${{ hashFiles('stack.yaml', 'stack.yaml.lock', '**/package.yaml') }}"
          restore-keys: stack-nix-${{ runner.os }}-${{ steps.nixpkgs.outputs.version }}-

      - name: Build, test and build the documentation
        run: stack --nix build --test --haddock --no-haddock-deps
